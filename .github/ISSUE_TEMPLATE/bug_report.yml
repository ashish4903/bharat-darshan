name: Bug report
description: Something on the site doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Page link
      placeholder: https://ashish4903.github.io/bharat-darshan/#/state/goa
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android 15, Chrome 140
